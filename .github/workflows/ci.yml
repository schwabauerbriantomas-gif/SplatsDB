name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # build sin CUDA: el camino garantizado para consumidores sin nvcc/driver
          - label: cpu-only
            features: --no-default-features
          # default desde v2.6.0: feature cuda ON (compila sin nvcc; degrada en runtime)
          - label: default-cuda
            features: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (${{ matrix.label }})
        run: cargo build --verbose ${{ matrix.features }}

      - name: Runtime smoke sin GPU (${{ matrix.label }})
        if: matrix.label == 'default-cuda'
        run: cargo run --quiet -- gpu-info

      - name: Run tests (${{ matrix.label }})
        run: cargo test --verbose ${{ matrix.features }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      # deps muertas en Cargo.toml (14-nov: encontró `regex` sin refs).
      # Prebuilt via install-action: segundos, no compila.
      - name: Unused dependencies (cargo-machete)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Run cargo-machete
        run: cargo machete

      - name: Clippy (default)
        run: cargo clippy -- -D warnings

      - name: Clippy (cpu-only)
        run: cargo clippy --no-default-features -- -D warnings

  # Standalone advisory scan: no `needs` to/from the other jobs, so a RustSec
  # registry outage here never blocks the main test/lint pipeline, while the
  # job itself still fails loudly on real advisories (continue-on-error is
  # intentionally NOT set).
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check dependencies for RUSTSEC advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0441 (pin-utils unmaintained): informational only —
          # zero vulnerabilities (verified in run 42041983518). Transitive
          # via hyper -> axum, no patched version exists (upstream archived
          # 2026-10-01). Re-evaluate when hyper/axum drop pin-utils.
          ignore: RUSTSEC-2026-0441

  # Numeric validation harness: deterministic unit tests plus a small Faiss
  # integration probe, the LongMemEval scope tests and the report sync check.
  # UMAP is intentionally not installed in CI; the local
  # atlas runner remains syntax-checked and receipt-verified separately.
  benchmark-tools:
    name: Benchmark tools (IVF/atlas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric test dependencies
        run: python -m pip install numpy scipy scikit-learn matplotlib faiss-cpu
      - name: Byte-compile benchmark harness
        run: python -m py_compile benchmarks/ivf_atlas_common.py benchmarks/benchmark_ivf.py benchmarks/build_embedding_atlas.py benchmarks/report_ivf_atlas.py tests/test_ivf_atlas.py benchmarks/longmemeval_scope.py benchmarks/report_longmemeval_scope.py benchmarks/benchmark_reproducible.py tests/test_longmemeval_scope.py
      - name: Unit and Faiss integration tests
        run: python -m unittest discover -s tests -p 'test_ivf_atlas.py' -v

      - name: Unit tests (LongMemEval scope) and report sync
        run: |
          python -m unittest discover -s tests -p 'test_longmemeval_scope.py' -v
          python benchmarks/report_longmemeval_scope.py --check

  # Python tooling of the Hermes memory hub (semantic-hub/hermes_*).
  # Stdlib-only by design: no pip deps, no GPU, no services — the embed
  # server is mocked with an in-thread http.server.
  python-tools:
    name: Python tools (hermes hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile tools (syntax gate)
        run: python -m py_compile semantic-hub/hermes_lib.py semantic-hub/hermes_ingest.py semantic-hub/hermes_merge.py semantic-hub/hermes_recall.py semantic-hub/hermes_smoke.py semantic-hub/sac_recap.py semantic-hub/sac_recall_digest.py semantic-hub/hermes_stack_check.py semantic-hub/check_dead_code.py semantic-hub/sem-search.py

      - name: Dead-code gate (AST stdlib-only)
        run: python semantic-hub/check_dead_code.py

      - name: Unit tests (mocked embed server)
        run: python -m unittest discover -s semantic-hub/tests -v
